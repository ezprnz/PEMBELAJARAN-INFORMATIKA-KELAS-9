<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InformatikaKu — Belajar Informatika Kelas IX</title>
  <meta name="description" content="Media pembelajaran Informatika kelas IX SMP/MTs semester gasal 2026/2027.">
  <meta name="theme-color" content="#3d5af1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body id="body">
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#f5f6fa;flex-direction:column;gap:18px">
      <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#3d5af1,#6b7dff);display:flex;align-items:center;justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <div style="font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;color:#1a1d35;letter-spacing:-.3px">InformatikaKu</div>
      <div style="display:flex;gap:6px">
        <div style="width:7px;height:7px;border-radius:50%;background:#3d5af1;animation:ld .7s ease-in-out infinite"></div>
        <div style="width:7px;height:7px;border-radius:50%;background:#3d5af1;animation:ld .7s .15s ease-in-out infinite"></div>
        <div style="width:7px;height:7px;border-radius:50%;background:#3d5af1;animation:ld .7s .3s ease-in-out infinite"></div>
      </div>
    </div>
  </div>
  <style>
    @keyframes ld {
      0%,100% { transform:scale(1);opacity:1; }
      50% { transform:scale(.5);opacity:.3; }
    }
  </style>
  <script src="js/data.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/features.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
